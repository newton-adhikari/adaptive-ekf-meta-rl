# CC-MetaEKF Training Configuration (Phase 1: 6D)

# Environment
environment:
  state_dim: 6
  meas_dim: 2
  dt: 0.1
  episode_length: 100       # shorter episodes for stability
  innovation_window: 16
  q_nominal: 0.1
  r_nominal: 1.0
  n_q: 6
  n_r: 2

# Agent
agent:
  encoder_type: "st_sie"
  latent_dim: 32
  hidden_dim: 256
  lr: 3.0e-4
  gamma: 0.95
  tau: 0.005
  batch_size: 256
  device: "cpu"
  reward_scale: 1.0        

  # PID-Lagrangian
  delta: 0.1
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_integral_max: 10.0

  # ST-SIE encoder
  stft_window: 16
  stft_hop: 4

# Training
training:
  n_epochs: 300
  tasks_per_epoch: 4
  context_episodes: 1
  train_episodes: 2
  gradient_steps: 30
  eval_interval: 10
  save_interval: 50
  buffer_capacity: 50000
  buffer_max_tasks: 200

# Logging
logging:
  log_dir: "runs/"
  log_interval: 1

 